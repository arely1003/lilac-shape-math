name: Deploy FormaFácil to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run existing tests
        run: npm test

      - name: Build static FormaFácil
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # TanStack Start emits static HTML and browser assets in dist/client.
      # Publish only those files, never the server bundle.
      - name: Prepare dist for Pages
        run: |
          test -s dist/client/index.html
          staging=$(mktemp -d)
          cp -a dist/client/. "$staging/"
          rm -rf dist
          mkdir dist
          cp -a "$staging/." dist/
          rm -rf "$staging"
          touch dist/.nojekyll
          test -s dist/index.html

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4